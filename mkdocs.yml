site_name: Arthur's AI Advisory Blog
site_url: https://arthurchan.github.io/my-blog
site_description: "A collection of essays and thoughts of Arthur"
site_author: Arthur Chan

theme:
  name: material
  logo: images/ArthurChanConsulting.ico
  palette:
    - scheme: default
      primary: blue
      accent: light blue
    - scheme: slate
      primary: blue
      accent: cyan
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.top
    - toc.integrate
    - search.highlight

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      pagination_per_page: 10

nav:
  - Home: index.md
  - Blog: blog/index.md
  - About: about.md
  - Full bio: fullbio.md
  - Publications: publications.md
  - AI Portfolio: ai_portfolio.md
  - Resources:
      - resources.md
      - learning-dl-top5.md
      - book-recommendations.md
               
        

extra_css:
  - assets/custom.css

markdown_extensions:
  - toc:
      permalink: true
  - footnotes
  - attr_list
  - admonition
  - pymdownx.superfences
  - pymdownx.details

